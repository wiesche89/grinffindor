name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK r26c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true

      # Qt Linux-Hosttools (qmake, moc, rcc …)
      - name: Install Qt (Linux host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          set-env: true

      # Qt Android arm64-v8a Bibliotheken
      - name: Install Qt (Android arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true
          set-env: false

      - name: Generate Makefile with qmake
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Qt 6 liest ANDROID_SDK_ROOT und ANDROID_NDK_ROOT aus der Umgebung.
          # Auf dem Runner ist ANDROID_SDK_ROOT bereits gesetzt.
          QT_ANDROID_BIN="${{ env.QT_ROOT_DIR }}/../android_arm64_v8a/bin"

          mkdir -p build-android
          cd build-android

          "$QT_ANDROID_BIN/qmake" ../grinffindor.pro \
            -spec android-clang \
            CONFIG+=release \
            ANDROID_ABIS=arm64-v8a \
            ANDROID_MIN_SDK_VERSION=28 \
            ANDROID_TARGET_SDK_VERSION=34

      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd build-android
          make -j$(nproc)

      - name: Build APK (debug – kein Keystore nötig)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd build-android
          make apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grinffindor-android-${{ github.sha }}
          path: build-android/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Telegram – Status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && EMOJI="✅" || EMOJI="❌"
          COMMIT=$(echo "$COMMIT_MESSAGE" | head -1)
          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "${EMOJI} <b>Workflow status:</b> ${STATUS}

🤖 <b>Platform:</b> Android
🧑‍💻 <b>Actor:</b> ${{ github.actor }}
📦 <b>Repository:</b> ${{ github.repository }}
🏹 <b>Workflow:</b> ${{ github.workflow }}
🏷️ <b>Branch:</b> ${{ github.ref_name }}
🔨 <b>Commit:</b> ${COMMIT}" \
            '{chat_id: $chat_id, parse_mode: "HTML", text: $text}' | \
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-

      - name: Telegram – APK hochladen
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          APK=$(find build-android/android-build/build/outputs/apk -name "*.apk" | head -1)
          [ -z "$APK" ] && exit 0
          FILENAME="grinffindor-${{ github.ref_name }}-android.apk"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"$APK;filename=${FILENAME}" \
            -F caption="🤖 Android APK"

