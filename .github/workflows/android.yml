name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK r26c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true

      # Qt Linux-Hosttools (qmake, moc, rcc …)
      - name: Install Qt (Linux host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          set-env: true

      # Qt Android arm64-v8a Bibliotheken
      - name: Install Qt (Android arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true
          set-env: false

      - name: Generate Makefile with qmake
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          QT_ANDROID=${{ env.QT_ROOT_DIR }}/../android_arm64_v8a

          mkdir -p build-android
          cd build-android

          qmake ../grinffindor.pro \
            -spec android-clang \
            CONFIG+=release \
            ANDROID_ABIS=arm64-v8a \
            ANDROID_MIN_SDK_VERSION=28 \
            ANDROID_TARGET_SDK_VERSION=34 \
            ANDROID_PACKAGE_SOURCE_DIR=$$PWD/../android \
            QMAKE_ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            QMAKE_ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      - name: Build
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd build-android
          make -j$(nproc)

      - name: Build APK (debug – kein Keystore nötig)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd build-android
          make apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grinffindor-android-${{ github.sha }}
          path: build-android/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error

