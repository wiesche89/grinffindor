name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios-simulator:
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Qt macOS-Hosttools (qmake, moc, rcc …)
      - name: Install Qt (macOS host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'mac'
          target: 'desktop'
          cache: true
          set-env: true

      # Qt iOS-Bibliotheken (Cross-Compile-Ziel)
      - name: Install Qt (iOS target)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'mac'
          target: 'ios'
          cache: true
          set-env: false

      - name: Generate Xcode project with qmake
        run: |
          mkdir -p build-ios
          cd build-ios

          qmake ../grinffindor.pro \
            -spec macx-ios-clang \
            CONFIG+=iphonesimulator \
            CONFIG+=simulator \
            CONFIG+=release \
            QMAKE_IOS_DEPLOYMENT_TARGET=15.0 \
            "QMAKE_APPLE_DEVICE_ARCHS=x86_64 arm64"

      - name: Build for Simulator (kein Signing)
        run: |
          cd build-ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grinffindor-simulator-${{ github.sha }}
          # .app-Bundle aus dem DerivedData-Verzeichnis hochladen
          path: build-ios/**/*.app
          if-no-files-found: warn

