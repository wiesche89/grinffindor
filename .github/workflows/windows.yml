name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          set-env: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build-windows
          cd build-windows
          qmake ..\grinffindor.pro CONFIG+=release
          nmake

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grinffindor-windows-${{ github.sha }}
          path: build-windows/release/grinffindor.exe
          if-no-files-found: error

      - name: Telegram – Status
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && EMOJI="✅" || EMOJI="❌"
          COMMIT=$(echo "$COMMIT_MESSAGE" | head -1)
          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "${EMOJI} <b>Workflow status:</b> ${STATUS}

🪟 <b>Platform:</b> Windows
🧑‍💻 <b>Actor:</b> ${{ github.actor }}
📦 <b>Repository:</b> ${{ github.repository }}
🏹 <b>Workflow:</b> ${{ github.workflow }}
🏷️ <b>Branch:</b> ${{ github.ref_name }}
🔨 <b>Commit:</b> ${COMMIT}" \
            '{chat_id: $chat_id, parse_mode: "HTML", text: $text}' | \
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-

      - name: Telegram – EXE hochladen
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          FILENAME="grinffindor-${{ github.ref_name }}-win-x86_64"
          powershell -Command "Compress-Archive -Path 'build-windows/release/grinffindor.exe' -DestinationPath '${FILENAME}.zip'"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"${FILENAME}.zip" \
            -F caption="🪟 Windows EXE"
