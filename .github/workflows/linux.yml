name: Linux Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-glx0-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-util-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          set-env: true

      - name: Build
        run: |
          mkdir -p build-linux
          cd build-linux
          qmake ../grinffindor.pro CONFIG+=release
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grinffindor-linux-${{ github.sha }}
          path: build-linux/grinffindor
          if-no-files-found: error

      - name: Telegram – Status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && EMOJI="✅" || EMOJI="❌"
          COMMIT=$(echo "$COMMIT_MESSAGE" | head -1)
          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "${EMOJI} <b>Workflow status:</b> ${STATUS}

🐧 <b>Platform:</b> Linux
🧑‍💻 <b>Actor:</b> ${{ github.actor }}
📦 <b>Repository:</b> ${{ github.repository }}
🏹 <b>Workflow:</b> ${{ github.workflow }}
🏷️ <b>Branch:</b> ${{ github.ref_name }}
🔨 <b>Commit:</b> ${COMMIT}" \
            '{chat_id: $chat_id, parse_mode: "HTML", text: $text}' | \
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-

      - name: Telegram – Binary hochladen
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          FILENAME="grinffindor-${{ github.ref_name }}-linux-x86_64"
          zip "${FILENAME}.zip" build-linux/grinffindor
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"${FILENAME}.zip" \
            -F caption="🐧 Linux Binary"
