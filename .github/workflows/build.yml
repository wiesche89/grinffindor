name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # Version
  # ─────────────────────────────────────────────
  read-version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from grinffindor.pro
        id: version
        run: |
          VER="$(grep -E '^VERSION\s*=' grinffindor.pro \
                 | sed 's/^VERSION\s*=\s*//' \
                 | tr -d ' \r\n')"
          [ -n "$VER" ] || { echo "ERROR: VERSION not found in grinffindor.pro" >&2; exit 1; }
          echo "value=${VER}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VER}"

  # ─────────────────────────────────────────────
  # macOS (eigene Workflow-Datei)
  # ─────────────────────────────────────────────
  build-macos:
    needs: [read-version]
    uses: ./.github/workflows/macos.yml
    with:
      app_version: ${{ needs.read-version.outputs.app_version }}
    secrets: inherit

  # ─────────────────────────────────────────────
  # Android
  # ─────────────────────────────────────────────
  build-android:
    name: Android
    runs-on: ubuntu-latest
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          set-env: true

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true
          set-env: false

      - name: qmake
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p build-android && cd build-android
          "${{ env.QT_ROOT_DIR }}/../android_arm64_v8a/bin/qmake" ../grinffindor.pro \
            -spec android-clang CONFIG+=release \
            ANDROID_ABIS=arm64-v8a \
            ANDROID_MIN_SDK_VERSION=28 \
            ANDROID_TARGET_SDK_VERSION=34

      - name: make
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cd build-android && make -j$(nproc)

      - name: make apk
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cd build-android && make apk

      - uses: actions/upload-artifact@v4
        with:
          name: grinffindor-android-${{ needs.read-version.outputs.app_version }}
          path: build-android/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # Linux
  # ─────────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglib2.0-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-glx0-dev \
            libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev ninja-build

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          set-env: true

      - name: Build
        run: |
          mkdir -p build-linux && cd build-linux
          qmake ../grinffindor.pro CONFIG+=release
          make -j$(nproc)

      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps

          cp build-linux/grinffindor AppDir/usr/bin/
          cp media/tiles/tile_grinffindor.PNG \
             AppDir/usr/share/icons/hicolor/256x256/apps/grinffindor.png

          cat > AppDir/usr/share/applications/grinffindor.desktop << 'EOF'
          [Desktop Entry]
          Name=Grinffindor
          Exec=grinffindor
          Icon=grinffindor
          Type=Application
          Categories=Finance;
          EOF

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=$(which qmake)

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: grinffindor-linux-${{ needs.read-version.outputs.app_version }}
          path: Grinffindor-*.AppImage
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # Windows
  # ─────────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          set-env: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build-windows
          cd build-windows
          qmake ..\grinffindor.pro CONFIG+=release
          nmake

      - name: windeployqt
        shell: cmd
        run: |
          windeployqt --release --no-translations --qmldir qml ^
            build-windows\release\grinffindor.exe

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        shell: powershell
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.UI.wixext/6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate WiX fragment
        shell: powershell
        run: |
          .\packaging\windows\Generate-WixFragment.ps1 `
            -SourceDir .\build-windows\release `
            -OutputFile .\build-windows\installer\GeneratedFiles.wxs

      - name: Build MSI
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\build-windows\installer -Force | Out-Null
          wix build `
            .\packaging\windows\Grinffindor.Package.wxs `
            .\build-windows\installer\GeneratedFiles.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -bindvariable WixUILicenseRtf=.\\packaging\\windows\\License.rtf `
            -d Version=${{ needs.read-version.outputs.app_version }} `
            -o .\build-windows\installer\Grinffindor-${{ needs.read-version.outputs.app_version }}-x64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: grinffindor-windows-${{ needs.read-version.outputs.app_version }}
          path: build-windows/release/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: grinffindor-windows-msi-${{ needs.read-version.outputs.app_version }}
          path: build-windows/installer/*.msi
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # iOS (echtes Gerät – Development IPA)
  # ─────────────────────────────────────────────
  # Benötigte Secrets (GitHub → Settings → Secrets → Actions):
  #   IOS_CERTIFICATE_P12        – Base64-kodiertes .p12 Development-Zertifikat
  #   IOS_CERTIFICATE_PASSWORD   – Passwort des .p12-Archivs
  #   IOS_PROVISIONING_PROFILE   – Base64-kodiertes .mobileprovision (Development)
  #   IOS_TEAM_ID                – 10-stellige Apple Team ID (z.B. AB12CD34EF)
  # ─────────────────────────────────────────────
  build-ios:
    name: iOS
    runs-on: macos-latest
    needs: [read-version]
    env:
      IOS_BUNDLE_ID: org.wiesche89.grinffindor
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'mac'
          target: 'ios'
          cache: true
          set-env: true

      # ── Zertifikat in temporären Keychain importieren ──────────────────────
      - name: Import signing certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="ci_keychain_pw_fixed"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Persist password for subsequent steps
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ── Provisioning Profile installieren ─────────────────────────────────
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID xml1 -o - - \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"${PROFILE_UUID}.mobileprovision"
          echo "Installed provisioning profile UUID: $PROFILE_UUID"

      # ── qmake für echtes Gerät ─────────────────────────────────────────────
      - name: qmake
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          mkdir -p build-ios && cd build-ios
          qmake ../grinffindor.pro \
            -spec macx-ios-clang \
            CONFIG+=iphoneos CONFIG+=device CONFIG+=release \
            QMAKE_IOS_DEPLOYMENT_TARGET=16.0 \
            QMAKE_APPLE_DEVICE_ARCHS=arm64 \
            QMAKE_DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"

      # ── Archive erstellen ──────────────────────────────────────────────────
      - name: xcodebuild archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # Keychain vor dem Build erneut entsperren (kann zwischen Steps sperren)
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          cd build-ios
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "Building project: $XCODEPROJ  scheme: $SCHEME"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/grinffindor.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Grinffindor Development" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            archive

          echo "Archive created at: $RUNNER_TEMP/grinffindor.xcarchive"

      # ── IPA exportieren ────────────────────────────────────────────────────
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # Team ID in ExportOptions.plist einsetzen
          sed "s/APPLE_TEAM_ID_PLACEHOLDER/$IOS_TEAM_ID/" \
            ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/grinffindor.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # ── Keychain aufräumen ─────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: grinffindor-ios-${{ needs.read-version.outputs.app_version }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # TestFlight (App Store Distribution)
  # Läuft nur auf main-Branch wenn alle Secrets gesetzt sind.
  # Benötigte Secrets zusätzlich zu den iOS-Secrets:
  #   IOS_DIST_CERTIFICATE_P12       – Base64-kodiertes .p12 Distribution-Zertifikat
  #   IOS_DIST_CERTIFICATE_PASSWORD  – Passwort des .p12-Archivs
  #   IOS_APPSTORE_PROFILE           – Base64-kodiertes App Store .mobileprovision
  #   ASC_API_KEY_ID                 – App Store Connect API Key ID
  #   ASC_API_ISSUER_ID              – App Store Connect Issuer ID
  #   ASC_API_KEY                    – Base64-kodierter Inhalt der .p8 Datei
  # ─────────────────────────────────────────────
  testflight:
    name: TestFlight
    runs-on: macos-latest
    needs: [read-version]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      IOS_BUNDLE_ID: org.wiesche89.grinffindor
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'mac'
          target: 'ios'
          cache: true
          set-env: true

      # ── Distribution-Zertifikat importieren ───────────────────────────────
      - name: Import distribution certificate
        env:
          IOS_DIST_CERTIFICATE_P12: ${{ secrets.IOS_DIST_CERTIFICATE_P12 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/dist.keychain"
          KEYCHAIN_PASSWORD="dist_keychain_pw_fixed"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "$IOS_DIST_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DIST_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ── App Store Provisioning Profile installieren ───────────────────────
      - name: Install App Store provisioning profile
        env:
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_APPSTORE_PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" \
            | plutil -extract UUID xml1 -o - - \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$RUNNER_TEMP/appstore.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"${PROFILE_UUID}.mobileprovision"
          echo "Installed App Store profile UUID: $PROFILE_UUID"

      # ── qmake ─────────────────────────────────────────────────────────────
      - name: qmake
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          mkdir -p build-ios && cd build-ios
          qmake ../grinffindor.pro \
            -spec macx-ios-clang \
            CONFIG+=iphoneos CONFIG+=device CONFIG+=release \
            QMAKE_IOS_DEPLOYMENT_TARGET=16.0 \
            QMAKE_APPLE_DEVICE_ARCHS=arm64 \
            QMAKE_DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"

      # ── Archive ───────────────────────────────────────────────────────────
      - name: xcodebuild archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APP_VERSION: ${{ needs.read-version.outputs.app_version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          cd build-ios
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/grinffindor-appstore.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Grinffindor AppStore" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      # ── Debug: Icons im xcarchive prüfen ─────────────────────────────────
      - name: Debug - inspect icons in xcarchive
        run: |
          ARCHIVE="$RUNNER_TEMP/grinffindor-appstore.xcarchive"
          echo "=== Alle PNG-Dateien im xcarchive ==="
          find "$ARCHIVE" -name "*.png" | sort
          echo ""
          echo "=== Icon-Modus (alpha?) ==="
          pip3 install --quiet Pillow
          python3 -c "
import glob, os
from PIL import Image
for f in sorted(glob.glob('$ARCHIVE/**/*.png', recursive=True)):
    try:
        img = Image.open(f)
        name = os.path.basename(f)
        print(f'{name}: mode={img.mode} size={img.size}')
    except Exception as e:
        print(f'{f}: ERROR {e}')
"

      # ── IPA exportieren (App Store) ───────────────────────────────────────
      - name: Export App Store IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          sed "s/APPLE_TEAM_ID_PLACEHOLDER/$IOS_TEAM_ID/" \
            ios/ExportOptionsAppStore.plist > "$RUNNER_TEMP/ExportOptionsAppStore.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/grinffindor-appstore.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-appstore" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsAppStore.plist"

      # ── Upload zu TestFlight ──────────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

          IPA_PATH=$(find "$RUNNER_TEMP/ipa-appstore" -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      # ── Keychain aufräumen ────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dist.keychain" 2>/dev/null || true

  # ─────────────────────────────────────────────
  # WebAssembly
  # ─────────────────────────────────────────────
  build-wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.50'

      # Qt 6.7+ WASM-Pakete liegen unter host=all_os, target=wasm
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          set-env: true

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'
          cache: true
          set-env: false

      - name: Build
        run: |
          mkdir -p build-wasm && cd build-wasm
          "${{ env.QT_ROOT_DIR }}/../wasm_singlethread/bin/qmake" ../grinffindor.pro \
            -spec wasm-emscripten CONFIG+=release CONFIG+=sdk_no_version_check
          make -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p wasm-dist
          cd build-wasm
          cp grinffindor.html grinffindor.js grinffindor.wasm qtloader.js qtlogo.svg \
             ../wasm-dist/ 2>/dev/null || true
          [ -d media ] && cp -r media ../wasm-dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: grinffindor-wasm-${{ needs.read-version.outputs.app_version }}
          path: wasm-dist/
          if-no-files-found: warn

      - name: Prepare image tags
        id: image-vars
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_VERSION: ${{ needs.read-version.outputs.app_version }}
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="$(printf '%s\n%s\n%s' \
            "ghcr.io/${OWNER_LC}/grinffindor:latest" \
            "ghcr.io/${OWNER_LC}/grinffindor:${APP_VERSION}" \
            "ghcr.io/${OWNER_LC}/grinffindor:sha-${SHORT_SHA}")"

          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            TAGS="${TAGS}"$'\n'"${DOCKERHUB_USERNAME}/grinffindor:latest"$'\n'"${DOCKERHUB_USERNAME}/grinffindor:${APP_VERSION}"$'\n'"${DOCKERHUB_USERNAME}/grinffindor:sha-${SHORT_SHA}"
            echo "dockerhub_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dockerhub_enabled=false" >> "${GITHUB_OUTPUT}"
          fi

          printf 'tags<<EOF\n%s\nEOF\n' "${TAGS}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.image-vars.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Docker image build
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PREBUILT_DIR=wasm-dist
            APP_VERSION=${{ needs.read-version.outputs.app_version }}
          platforms: linux/amd64
          push: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=grinffindor
            org.opencontainers.image.version=${{ needs.read-version.outputs.app_version }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PREBUILT_DIR=wasm-dist
            APP_VERSION=${{ needs.read-version.outputs.app_version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=grinffindor
            org.opencontainers.image.version=${{ needs.read-version.outputs.app_version }}

  # ─────────────────────────────────────────────
  # Telegram – eine Nachricht für alle Plattformen
  # ─────────────────────────────────────────────
  notify:
    name: Telegram
    runs-on: ubuntu-latest
    needs: [read-version, build-macos, build-android, build-linux, build-windows, build-ios, build-wasm, testflight]
    if: always()
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send status message
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          APP_VERSION: ${{ needs.read-version.outputs.app_version }}
          R_MACOS: ${{ needs.build-macos.result }}
          R_ANDROID: ${{ needs.build-android.result }}
          R_LINUX: ${{ needs.build-linux.result }}
          R_WINDOWS: ${{ needs.build-windows.result }}
          R_IOS: ${{ needs.build-ios.result }}
          R_WASM: ${{ needs.build-wasm.result }}
          R_TESTFLIGHT: ${{ needs.testflight.result }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          emoji() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          COMMIT="$COMMIT_MESSAGE"
          OVERALL="success"
          for s in "$R_MACOS" "$R_ANDROID" "$R_LINUX" "$R_WINDOWS" "$R_IOS" "$R_WASM" "$R_TESTFLIGHT"; do
            [ "$s" != "success" ] && OVERALL="failure"
          done
          [ "$OVERALL" = "success" ] && TOP="✅ <b>Build complete</b>" || TOP="❌ <b>Build failed</b>"
          MSG="${TOP}"$'\n\n'
          MSG+="$(emoji $R_MACOS) 🍏 macOS: ${R_MACOS}"$'\n'
          MSG+="$(emoji $R_ANDROID) 🤖 Android: ${R_ANDROID}"$'\n'
          MSG+="$(emoji $R_LINUX) 🐧 Linux: ${R_LINUX}"$'\n'
          MSG+="$(emoji $R_WINDOWS) 🪟 Windows: ${R_WINDOWS}"$'\n'
          MSG+="$(emoji $R_IOS) 🍎 iOS: ${R_IOS}"$'\n'
          MSG+="$(emoji $R_WASM) 🌐 WebAssembly: ${R_WASM}"$'\n'
          MSG+="$(emoji $R_TESTFLIGHT) 🚀 TestFlight: ${R_TESTFLIGHT}"$'\n\n'
          MSG+="🧑‍💻 <b>Actor:</b> ${{ github.actor }}"$'\n'
          MSG+="📦 <b>Repository:</b> ${{ github.repository }}"$'\n'
          MSG+="🏷️ <b>Branch:</b> ${{ github.ref_name }}"$'\n'
          MSG+="🔢 <b>Version:</b> ${APP_VERSION}"$'\n'
          MSG+="🔨 <b>Commit:</b>"$'\n'"${COMMIT}"$'\n\n'
          MSG+="📎 <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Download artifacts</a>"
          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MSG" \
            '{chat_id: $chat_id, parse_mode: "HTML", text: $text, disable_web_page_preview: true}' | \
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-
