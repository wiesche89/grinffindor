name: WebAssembly Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-wasm:
    name: WebAssembly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Qt 6.7.2 ist die letzte Version mit belegtem wasm_singlethread-Paket
      # in aqtinstall. Qt 6.8.x hat kein WASM-Paket im aqtinstall-Mirror.
      # Emscripten 3.1.50 ist kompatibel mit Qt 6.7.x.
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.50'
          actions-cache-folder: 'emsdk-cache'

      # Qt Linux-Hosttools (qmake, moc, rcc …)
      - name: Install Qt (Linux host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          set-env: true

      # Qt WASM single-threaded Bibliotheken
      - name: Install Qt (WebAssembly single-threaded)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'
          arch: 'wasm_singlethread'
          cache: true
          set-env: false

      - name: Build
        run: |
          # QT_ROOT_DIR zeigt auf gcc_64 (Host).
          # WASM-qmake liegt im Nachbarverzeichnis wasm_singlethread.
          # QT_ROOT_DIR zeigt auf gcc_64 (6.7.2 Host).
          QT_WASM_BIN="${{ env.QT_ROOT_DIR }}/../wasm_singlethread/bin"

          mkdir -p build-wasm
          cd build-wasm

          "$QT_WASM_BIN/qmake" ../grinffindor.pro \
            -spec wasm-emscripten \
            CONFIG+=release \
            CONFIG+=sdk_no_version_check

          make -j$(nproc)

      - name: Collect WASM artifacts
        run: |
          mkdir -p wasm-dist
          cd build-wasm
          cp grinffindor.html \
             grinffindor.js \
             grinffindor.wasm \
             qtloader.js \
             ../wasm-dist/ 2>/dev/null || true
          # Mediendateien falls vorhanden
          [ -d media ] && cp -r media ../wasm-dist/ || true

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: grinffindor-wasm-${{ github.sha }}
          path: wasm-dist/
          if-no-files-found: error

      - name: Telegram – Status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && EMOJI="✅" || EMOJI="❌"
          COMMIT=$(echo "$COMMIT_MESSAGE" | head -1)
          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "${EMOJI} <b>Workflow status:</b> ${STATUS}

🌐 <b>Platform:</b> WebAssembly
🧑‍💻 <b>Actor:</b> ${{ github.actor }}
📦 <b>Repository:</b> ${{ github.repository }}
🏹 <b>Workflow:</b> ${{ github.workflow }}
🏷️ <b>Branch:</b> ${{ github.ref_name }}
🔨 <b>Commit:</b> ${COMMIT}" \
            '{chat_id: $chat_id, parse_mode: "HTML", text: $text}' | \
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-

      - name: Telegram – WASM hochladen
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          FILENAME="grinffindor-${{ github.ref_name }}-wasm"
          cd wasm-dist && zip -r "../${FILENAME}.zip" . && cd ..
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"${FILENAME}.zip" \
            -F caption="🌐 WebAssembly Build"
